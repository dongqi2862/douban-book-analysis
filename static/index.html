<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆瓣图书数据分析 - 首页</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  background: #f0f4f9;
  color: #2c3e50;
}
.sidebar {
  position: fixed;
  left: 0; top: 0;
  width: 240px;
  height: 100vh;
  background: linear-gradient(180deg, #1e3a5f 0%, #165DFF 100%);
  color: #fff;
  overflow-y: auto;
  box-shadow: 2px 0 8px rgba(0,0,0,0.12);
  z-index: 100;
}
.sidebar .logo {
  padding: 24px 20px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  text-align: center;
}
.sidebar .logo small { display: block; font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 6px; }
.sidebar nav { padding: 16px 0; }
.sidebar nav a {
  display: flex;
  align-items: center;
  padding: 13px 24px;
  color: rgba(255,255,255,0.78);
  text-decoration: none;
  font-size: 14px;
  border-left: 3px solid transparent;
  transition: all 0.2s;
}
.sidebar nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
.sidebar nav a.active {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border-left-color: #4fc3f7;
  font-weight: 600;
}
.sidebar nav a .icon { margin-right: 10px; font-size: 16px; }
.main {
  margin-left: 240px;
  padding: 24px;
  min-height: 100vh;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.header h1 { font-size: 22px; color: #1e3a5f; font-weight: 700; }
.header .crumb { font-size: 13px; color: #7a8a99; }
.card {
  background: #fff;
  border-radius: 6px;
  padding: 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  margin-bottom: 20px;
  border: 1px solid #e6ecf2;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  color: #1e3a5f;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 2px solid #165DFF;
  display: inline-block;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 20px;
}
.stat-card {
  background: #fff;
  border-radius: 6px;
  padding: 22px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border: 1px solid #e6ecf2;
  border-top: 3px solid #165DFF;
}
.stat-card .num { font-size: 30px; font-weight: 700; color: #165DFF; }
.stat-card .label { font-size: 13px; color: #7a8a99; margin-top: 6px; }
.chart-box { width: 100%; height: 380px; }
.loading, .error-msg {
  text-align: center;
  padding: 60px 20px;
  color: #95a5a6;
  font-size: 14px;
}
.error-msg { color: #e74c3c; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">豆瓣图书数据分析<small>DOUBAN BOOK DASHBOARD</small></div>
  <nav>
    <a href="index.html" class="active"><span class="icon">▣</span>首页</a>
    <a href="page1-score.html"><span class="icon">★</span>评分统计</a>
    <a href="page2-country.html"><span class="icon">◎</span>国别分布</a>
    <a href="page3-hotbook.html"><span class="icon">☰</span>热门图书</a>
    <a href="page4-year.html"><span class="icon">▤</span>出版年份</a>
  </nav>
</div>
<div class="main">
  <div class="header">
    <h1>数据概览</h1>
    <div class="crumb">首页 / 概览</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="s1">—</div><div class="label">图书总数</div></div>
    <div class="stat-card"><div class="num" id="s3">27</div><div class="label">涉及国家</div></div>
    <div class="stat-card"><div class="num" id="s4">1962 - 2024</div><div class="label">出版年份跨度</div></div>
  </div>

  <div class="card">
    <div class="card-title">出版年份趋势概览</div>
    <div id="chartYear" class="chart-box"><div class="loading">数据加载中...</div></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000/api/';

function fetchJSON(url, cb, errCb) {
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => cb(d))
    .catch(e => { if (errCb) errCb(e); });
}

// 年份接口 year_count
fetchJSON(API + 'year_count/', function(data) {
  const arr = data.data;
  const years = arr.map(i => i.year);
  const counts = arr.map(i => i.book_count);
  // 图书总数从年份求和拿到
  const total = counts.reduce((a,b)=>a+b,0);
  document.getElementById('s1').textContent = total;

  const chart = echarts.init(document.getElementById('chartYear'));
  chart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 50, right: 30, top: 40, bottom: 40 },
    xAxis: { type: 'category', data: years, axisLine: { lineStyle: { color: '#cfd8e3' } } },
    yAxis: { type: 'value', axisLine: { lineStyle: { color: '#cfd8e3' } }, splitLine: { lineStyle: { color: '#eef2f7' } } },
    series: [{ type: 'line', data: counts, smooth: true, itemStyle: { color: '#165DFF' }, areaStyle: { color: 'rgba(22,93,255,0.12)' } }]
  });
}, function() {
  document.getElementById('chartYear').innerHTML = '<div class="error-msg">数据加载失败，请检查接口 year_count/</div>';
});

window.addEventListener('resize', function() {
  const inst = echarts.getInstanceByDom(document.getElementById('chartYear'));
  if (inst) inst.resize();
});
</script>
</body>
</html>
